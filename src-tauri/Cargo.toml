[package]
name = "evolve-synth"
version = "0.1.0"
description = "Managed browser session for Evolve Synth"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.0", features = [] }
tauri-plugin-global-shortcut = "2"
